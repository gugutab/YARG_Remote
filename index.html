<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YARG Remote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        card: '#1e293b',
                        accent: '#3b82f6',
                        accentHover: '#2563eb'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        body { background-color: #0f172a; color: #f8fafc; overflow: hidden; }
        
        .modal {
            display: none;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 50;
            align-items: center; justify-content: center;
        }
        .modal.open { display: flex; }
        
        .sort-asc::after { content: " \25B2"; font-size: 0.8em; opacity: 0.7; margin-left: 4px; }
        .sort-desc::after { content: " \25BC"; font-size: 0.8em; opacity: 0.7; margin-left: 4px; }
        .col-hidden { display: none !important; }

        /* Hide scrollbar for jump bar */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .inst-filter-btn {
            @apply bg-dark border border-slate-600 text-slate-400 hover:text-white hover:border-slate-500 rounded px-3 py-1 flex items-center justify-center transition-colors;
        }
        .inst-filter-btn.active {
            @apply bg-accent text-white border-accent;
        }
    </style>
</head>
<body class="h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-card border-b border-slate-700 p-2 sm:p-4 sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto w-full flex flex-col md:flex-row md:flex-wrap min-[900px]:flex-nowrap items-center gap-2 sm:gap-4">
            
            <div class="flex justify-between items-center w-full md:w-auto gap-4 shrink-0">
                <h1 class="text-2xl font-black italic uppercase tracking-tighter flex items-center gap-2 shrink-0">
                    <i data-lucide="gamepad-2" class="text-accent"></i>
                    <span class="hidden min-[450px]:inline">YARG <span class="text-accent">Remote</span></span>
                </h1> 
                
                <div class="flex items-center gap-2 flex-1 md:flex-none">
                    <div class="flex bg-dark rounded-lg border border-slate-600 overflow-hidden px-2 py-1 items-center flex-1 w-full md:w-56">
                        <div id="connection-status" class="w-3 h-3 rounded-full bg-rose-500 mr-2 transition-all duration-500 shadow-none" title="Disconnected"></div>
                        <input type="text" id="api-url" class="bg-transparent border-none outline-none text-sm w-full text-white disabled:text-slate-500 disabled:cursor-not-allowed" value="http://localhost:8888" placeholder="API URL">
                        <button id="action-btn" onclick="handleConnectionToggle()" class="text-slate-400 hover:text-white p-1 ml-1 rounded-lg transition-colors" title="Connect">
                            <i data-lucide="log-in" class="w-4 h-4" id="action-icon"></i> 
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Search Bar & Filters -->
            <div class="flex-1 w-full md:w-auto min-[900px]:mx-4 relative group order-2 md:order-none">
                <div class="flex items-center w-full bg-dark border border-slate-600 rounded-lg py-1 pl-3 pr-2 text-sm text-white focus-within:border-accent transition-colors relative">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 mr-2 shrink-0"></i>
                    
                    <div id="search-chips" class="flex gap-1 flex-wrap items-center shrink-0 max-w-[60%] overflow-hidden empty:hidden mr-1"></div>
                    
                    <input type="text" id="search-global" list="datalist-global" oninput="applyFilters()" placeholder="Search..." class="bg-transparent border-none outline-none flex-1 min-w-[50px] py-0.5 placeholder-slate-500 text-white">
                    
                    <div class="flex items-center gap-1 shrink-0 ml-1">
                        <button id="clear-search-btn" onclick="clearFilters()" class="text-slate-400 hover:text-white p-1 hidden" title="Clear Filters">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                        <button onclick="toggleAdvancedFilters()" class="text-slate-400 hover:text-white p-1 rounded-md hover:bg-slate-700 transition-colors" title="Advanced Filters">
                            <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            
                <!-- Expanded Search Area -->
                <div id="advanced-filters" class="hidden absolute top-full left-0 right-0 mt-2 bg-card border border-slate-700 rounded-xl shadow-2xl p-4 z-50 flex flex-col gap-4">
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Song</label><input type="text" id="search-song" list="datalist-song" oninput="applyFilters()" class="w-full bg-dark border border-slate-600 rounded-md px-2 py-1 text-xs text-white focus:border-accent outline-none"></div>
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Artist</label><input type="text" id="search-artist" list="datalist-artist" oninput="applyFilters()" class="w-full bg-dark border border-slate-600 rounded-md px-2 py-1 text-xs text-white focus:border-accent outline-none"></div>
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Album</label><input type="text" id="search-album" list="datalist-album" oninput="applyFilters()" class="w-full bg-dark border border-slate-600 rounded-md px-2 py-1 text-xs text-white focus:border-accent outline-none"></div>
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Genre</label><input type="text" id="search-genre" list="datalist-genre" oninput="applyFilters()" class="w-full bg-dark border border-slate-600 rounded-md px-2 py-1 text-xs text-white focus:border-accent outline-none"></div>
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Year</label><input type="text" id="search-year" list="datalist-year" oninput="applyFilters()" class="w-full bg-dark border border-slate-600 rounded-md px-2 py-1 text-xs text-white focus:border-accent outline-none"></div>
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Charter</label><input type="text" id="search-charter" list="datalist-charter" oninput="applyFilters()" class="w-full bg-dark border border-slate-600 rounded-md px-2 py-1 text-xs text-white focus:border-accent outline-none"></div>
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Source</label><input type="text" id="search-source" list="datalist-source" oninput="applyFilters()" class="w-full bg-dark border border-slate-600 rounded-md px-2 py-1 text-xs text-white focus:border-accent outline-none"></div>
                    </div>
                    <div class="border-t border-slate-700 pt-3">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 block">Instruments</label>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="toggleInstrument('ALL')" class="inst-filter-btn active" data-inst="ALL">ALL</button>
                            <button onclick="toggleInstrument('guitar')" class="inst-filter-btn" data-inst="guitar" title="Guitar"><i data-lucide="guitar" class="w-4 h-4"></i></button>
                            <button onclick="toggleInstrument('bass')" class="inst-filter-btn" data-inst="bass" title="Bass"><i data-lucide="guitar" class="w-4 h-4"></i><span class="text-[10px] font-bold ml-1">BASS</span></button>
                            <button onclick="toggleInstrument('drum')" class="inst-filter-btn" data-inst="drum" title="Drums"><i data-lucide="drum" class="w-4 h-4"></i></button>
                            <button onclick="toggleInstrument('keys')" class="inst-filter-btn" data-inst="keys" title="Keys"><i data-lucide="piano" class="w-4 h-4"></i></button>
                            <button onclick="toggleInstrument('vocals')" class="inst-filter-btn" data-inst="vocals" title="Vocals"><i data-lucide="mic" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Toolbar (Aggregated) -->
            <div class="w-full min-[900px]:w-auto flex justify-between items-center min-[900px]:gap-4 order-3 min-[900px]:order-none pt-1 min-[900px]:pt-0">
                <span id="results-count" class="text-xs font-bold text-slate-400 bg-dark px-3 py-1 rounded-full border border-slate-700">0 songs</span> 
                <div class="flex gap-4 items-center">
                    <div class="relative">
                    <button onclick="toggleViewMode()" class="text-xs font-bold text-slate-400 hover:text-white flex items-center gap-1 bg-dark px-2 py-1 rounded border border-slate-700 mr-2">
                        <i id="view-toggle-icon" data-lucide="layout-grid" class="w-3 h-3"></i> <span id="view-toggle-text">Grid</span>
                    </button>
                        <button onclick="toggleColumnMenu()" class="text-xs font-bold text-slate-400 hover:text-white flex items-center gap-1 bg-dark px-2 py-1 rounded border border-slate-700">
                            <i data-lucide="columns" class="w-3 h-3"></i> Columns
                        </button>
                        <div id="column-menu" class="hidden absolute right-0 top-8 bg-card border border-slate-700 p-3 rounded-lg shadow-xl z-50 min-w-[160px] flex-col gap-2">
                            <!-- Checkboxes injected via JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto w-full p-4 flex flex-col gap-4 overflow-hidden">
        
        <!-- Jump Bar & Sort -->
        <div class="flex flex-col sm:flex-row gap-2 items-start sm:items-center shrink-0 min-h-[32px]">
            <div id="jump-bar" class="flex-1 flex gap-2 overflow-x-auto pb-1 scrollbar-hide hidden empty:hidden w-full"></div>
            <div class="flex items-center gap-2 ml-auto">
                <label for="sort-dropdown" class="text-xs font-bold text-slate-500 uppercase tracking-widest whitespace-nowrap">Sort by</label>
                <select id="sort-dropdown" onchange="handleSortChange(this.value)" class="bg-dark border border-slate-600 text-xs rounded px-2 py-1 text-slate-300 outline-none focus:border-accent">
                    <option value="name">Song</option>
                    <option value="artist">Artist</option>
                    <option value="album">Album</option>
                    <option value="genre">Genre</option>
                    <option value="year">Year</option>
                    <option value="charter">Charter</option>
                    <option value="source">Source</option>
                    <option value="duration">Duration</option>
                </select>
            </div>
        </div>

        <!-- Table/List -->
        <div class="bg-card rounded-xl border border-slate-700 shadow-sm flex-1 flex flex-col min-h-0 relative">
            <div class="overflow-auto flex-1 h-full" id="table-scroll-container">
                <!-- Fast Scroller Overlay -->
                <div id="fast-scroller" class="absolute right-0 top-10 bottom-10 w-8 z-30 flex flex-col justify-between items-center text-[10px] font-bold text-slate-500 select-none touch-none hidden py-2"></div>
                <div id="scroller-bubble" class="absolute right-12 top-0 w-12 h-12 bg-accent text-white rounded-full flex items-center justify-center font-bold text-xl shadow-lg pointer-events-none opacity-0 transition-opacity z-40">A</div>

                <div id="view-list">
                <table class="w-full text-left border-collapse relative">
                    <thead class="bg-card sticky top-0 z-10 shadow-sm">
                        <tr class="text-xs uppercase tracking-widest text-slate-400 border-b border-slate-700"> 
                            <th class="p-4 font-bold select-none min-w-[200px]" data-col="name">Song / Artist</th> 
                            <th class="p-4 font-bold text-center select-none" data-col="instruments">Instruments</th> 
                            <th class="p-4 font-bold text-center select-none" data-col="isMaster">Is Master</th> 
                            <th class="p-4 font-bold select-none hidden md:table-cell" data-col="album">Album</th> 
                            <th class="p-4 font-bold select-none hidden lg:table-cell" data-col="genre">Genre/Sub</th> 
                            <th class="p-4 font-bold select-none hidden xl:table-cell" data-col="charter">Charter</th> 
                            <th class="p-4 font-bold select-none hidden 2xl:table-cell" data-col="source">Source</th> 
                            <th class="p-4 font-bold select-none hidden sm:table-cell" data-col="year">Year</th> 
                            <th class="p-4 font-bold text-right select-none" data-col="duration">Duration</th> 
                            <th class="p-4 font-bold text-center select-none sticky right-0 bg-card border-l border-slate-700 z-20" data-col="play">Play</th>
                        </tr>
                    </thead>
                    <tbody id="song-list" class="text-sm divide-y divide-slate-700/50 bg-card">
                        <tr><td colspan="6" class="p-8 text-center text-slate-500 italic">Enter API URL and click Load.</td></tr> 
                    </tbody>
                </table>
                </div>
                <!-- Grid View -->
                <div id="view-grid" class="hidden grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 p-4 pb-10"></div>
                <!-- Infinite Scroll Sentinel inside the scroll container -->
                <div id="scroll-sentinel" class="h-10 w-full"></div>
            </div>
        </div>

    </main>

    <!-- Modal -->
    <div id="song-modal" class="modal">
        <div class="bg-card rounded-2xl w-full max-w-lg border border-slate-600 shadow-2xl overflow-hidden transform transition-all scale-95 opacity-0" id="modal-content" style="transition: all 0.2s;">
            
            <div class="relative w-full aspect-square group"> 
                <img id="modal-img" src="" class="w-full h-full object-cover bg-slate-900" alt="Album Art" onerror="this.style.display='none'">
                <div class="absolute inset-0 bg-gradient-to-t from-card via-black/40 to-transparent"></div>
                
                <button onclick="closeModal()" class="absolute right-4 top-4 text-white/80 hover:text-white bg-black/30 hover:bg-black/50 rounded-full p-2 backdrop-blur-sm transition-colors z-10"><i data-lucide="x"></i></button> 
                
                <div class="absolute bottom-0 left-0 right-0 p-6 flex items-end justify-between gap-4">
                    <div>
                        <h2 id="modal-title" class="text-[1.6rem] font-black italic text-white leading-none drop-shadow-lg">Song Name</h2> 
                        <p id="modal-artist" class="text-accent font-bold text-xl mt-1 drop-shadow-lg">Artist</p> 
                    </div>
                    <button id="modal-play-btn" class="bg-blue-700 hover:bg-blue-600 text-white w-14 h-14 rounded-full flex items-center justify-center transition-all shadow-lg shadow-accent/20 shrink-0 mb-1 hover:scale-105">
                        <i data-lucide="play" class="w-7 h-7 fill-current ml-1"></i>
                    </button>
                </div>
            </div> 
            
            <div class="px-6 py-4 bg-card/50"> 
                <div class="flex flex-wrap gap-2 text-sm text-slate-300"> 
                    <div class="bg-slate-800/50 border border-slate-700 rounded-full px-3 py-1 flex items-center gap-2" title="Album"><i data-lucide="disc" class="w-3 h-3 text-slate-500 shrink-0"></i> <span id="modal-album" class="font-medium text-white truncate max-w-[150px]">...</span></div>
                    <div class="bg-slate-800/50 border border-slate-700 rounded-full px-3 py-1 flex items-center gap-2" title="Year"><i data-lucide="calendar" class="w-3 h-3 text-slate-500 shrink-0"></i> <span id="modal-year" class="font-medium text-white truncate">...</span></div>
                    <div class="bg-slate-800/50 border border-slate-700 rounded-full px-3 py-1 flex items-center gap-2" title="Genre"><i data-lucide="music" class="w-3 h-3 text-slate-500 shrink-0"></i> <span id="modal-genre" class="font-medium text-white truncate max-w-[150px]">...</span></div>
                    <div class="bg-slate-800/50 border border-slate-700 rounded-full px-3 py-1 flex items-center gap-2" title="Duration"><i data-lucide="clock" class="w-3 h-3 text-slate-500 shrink-0"></i> <span id="modal-duration" class="font-medium text-white truncate">...</span></div>
                    <div class="bg-slate-800/50 border border-slate-700 rounded-full px-3 py-1 flex items-center gap-2" title="Source"><i data-lucide="database" class="w-3 h-3 text-slate-500 shrink-0"></i> <span id="modal-source" class="font-medium text-white truncate max-w-[150px]">...</span></div>
                    <div class="bg-slate-800/50 border border-slate-700 rounded-full px-3 py-1 flex items-center gap-2" title="Charter"><i data-lucide="user" class="w-3 h-3 text-slate-500 shrink-0"></i> <span id="modal-charter" class="font-medium text-white truncate max-w-[150px]">...</span></div>
                    <div class="bg-slate-800/50 border border-slate-700 rounded-full px-3 py-1 flex items-center gap-2" title="Is Master"><i data-lucide="check-circle-2" class="w-3 h-3 text-slate-500 shrink-0"></i> <span id="modal-ismaster" class="font-medium text-white truncate">...</span></div>
                </div>
            </div>
            
            <div id="modal-parts-container" class="px-6 pb-6 flex flex-wrap gap-2">
                <!-- Parts injected here via JS -->
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 right-4 bg-emerald-500 text-white px-4 py-3 rounded-lg shadow-xl font-bold text-sm transform translate-y-20 opacity-0 transition-all z-50 flex items-center gap-2"> 
        <i data-lucide="check-circle" class="w-5 h-5"></i> 
        <span id="toast-msg">Success!</span> 
    </div>

    <!-- Datalists for Autocomplete -->
    <datalist id="datalist-global"></datalist>
    <datalist id="datalist-song"></datalist>
    <datalist id="datalist-artist"></datalist>
    <datalist id="datalist-album"></datalist>
    <datalist id="datalist-genre"></datalist>
    <datalist id="datalist-year"></datalist>
    <datalist id="datalist-charter"></datalist>
    <datalist id="datalist-source"></datalist>

    <script>
        lucide.createIcons();

        let allSongs = [];
        let filteredSongs = [];
        let currentDisplayCount = 0;
        let renderedStartIndex = 0; // For bidirectional scrolling
        const PAGE_SIZE = 100;
        let currentSongHash = null;
        let isConnected = false;
        let pingInterval = null;
        let fuse = null;
        let imageObserver = null;
        let lastGroupValue = null;
        let currentGroups = [];
        let viewMode = 'list'; // 'list' or 'grid'
        let selectedInstruments = new Set(['ALL']);
        
        // Sorting & Columns State
        let sortState = { col: 'name', dir: 1 }; // 1 = asc, -1 = desc
        let columnState = {
            name: true,
            instruments: true,
            isMaster: false,
            album: true,
            genre: true,
            charter: true,
            source: false,
            year: true,
            duration: false,
            play: true
        };

        function updateConnectionUI(connected) {
            const btn = document.getElementById('action-btn');
            const statusDot = document.getElementById('connection-status');
            const urlInput = document.getElementById('api-url');

            if (connected) {
                statusDot.classList.remove('bg-rose-500', 'shadow-none');
                statusDot.classList.add('bg-emerald-500', 'shadow-[0_0_10px_#10b981]');
                statusDot.title = "Connected";

                btn.className = "text-white hover:text-slate-300 p-1 ml-1 rounded-lg transition-colors";
                btn.title = "Disconnect";
                btn.innerHTML = `<i data-lucide="x" class="w-4 h-4" id="action-icon"></i>`;
                urlInput.disabled = true;
            } else {
                statusDot.classList.remove('bg-emerald-500', 'shadow-[0_0_10px_#10b981]');
                statusDot.classList.add('bg-rose-500', 'shadow-none');
                statusDot.title = "Disconnected";

                btn.className = "text-slate-400 hover:text-white p-1 ml-1 rounded-lg transition-colors";
                btn.title = "Connect";
                btn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4" id="action-icon"></i>`;
                urlInput.disabled = false;
            }
            lucide.createIcons();
        }

        function toggleViewMode() {
            viewMode = viewMode === 'list' ? 'grid' : 'list';
            const listEl = document.getElementById('view-list');
            const gridEl = document.getElementById('view-grid');
            const icon = document.getElementById('view-toggle-icon');
            const text = document.getElementById('view-toggle-text');
            
            if (viewMode === 'list') {
                listEl.classList.remove('hidden');
                gridEl.classList.add('hidden');
                icon.setAttribute('data-lucide', 'layout-grid');
                text.innerText = 'Grid';
            } else {
                listEl.classList.add('hidden');
                gridEl.classList.remove('hidden');
                icon.setAttribute('data-lucide', 'list');
                text.innerText = 'List';
            }
            lucide.createIcons();
            
            // Re-render
            currentDisplayCount = 0;
            renderedStartIndex = 0;
            lastGroupValue = null;
            document.getElementById('song-list').innerHTML = '';
            document.getElementById('view-grid').innerHTML = '';
            loadMore();
        }

        function handleConnectionToggle() {
            if (isConnected) {
                // Disconnect logic
                isConnected = false;
                if (pingInterval) {
                    clearInterval(pingInterval);
                    pingInterval = null;
                }
                
                // Clear songs
                allSongs = [];
                filteredSongs = [];
                renderedStartIndex = 0;
                document.getElementById('song-list').innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500 italic">Disconnected.</td></tr>`;
                document.getElementById('view-grid').innerHTML = '';
                document.getElementById('results-count').innerText = '0 songs';

                updateConnectionUI(false);
                showToast("Disconnected");
            } else {
                // Connect logic
                fetchSongs();
                if (!pingInterval) {
                    pingInterval = setInterval(pingServer, 2000);
                }
            }
        }

        async function pingServer() {
            const url = document.getElementById('api-url').value.trim();
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000);
                
                const response = await fetch(`${url}/ping`, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (response.ok) {
                    if (!isConnected) {
                        isConnected = true;
                        updateConnectionUI(true);
                        
                        // Auto-load songs if connected and list is empty
                        if (allSongs.length === 0) fetchSongs();
                    }
                } else {
                    throw new Error('Ping failed');
                }
            } catch (err) {
                if (isConnected) {
                    isConnected = false;
                    updateConnectionUI(false);
                } else {
                    const btn = document.getElementById('action-btn');
                    if (btn && btn.innerHTML.includes('loader-2')) updateConnectionUI(false);
                }
            }
        }

        async function fetchSongs() {
            const url = document.getElementById('api-url').value.trim();
            const btn = document.getElementById('action-btn');
            
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin" id="action-icon"></i>`;
            document.getElementById('song-list').innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i>Loading songs...</td></tr>`;
            lucide.createIcons();
            
            try {
                const response = await fetch(`${url}/songs`);
                if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
                const data = await response.json();

                allSongs = data;
                
                // Initialize Fuzzy Search
                fuse = new Fuse(allSongs, {
                    keys: ['name', 'artist', 'album'],
                    threshold: 0.3, // 0.0 = exact match, 1.0 = match anything
                    ignoreLocation: true
                });

                initColumnMenu();
                populateAutocomplete();
                applyFilters();
                showToast(`Loaded ${allSongs.length} songs.`);
                
                isConnected = true;
                updateConnectionUI(true);
                if (!pingInterval) pingInterval = setInterval(pingServer, 2000);
            } catch (err) {
                console.error(err);
                document.getElementById('song-list').innerHTML = `<tr><td colspan="6" class="p-8 text-center text-rose-400 font-bold bg-rose-500/10">Error loading: ${err.message}<br><span class="text-xs font-normal text-slate-400">Check if the server is running and the URL is correct. (CORS issues may also occur)</span></td></tr>`;
                
                isConnected = false;
                updateConnectionUI(false);
            }
        }

        function populateAutocomplete() {
            const songs = new Set();
            const artists = new Set();
            const albums = new Set();
            const genres = new Set();
            const years = new Set();
            const charters = new Set();
            const sources = new Set();
            const globalTerms = new Set();

            allSongs.forEach(s => {
                if (s.name) songs.add(s.name);
                if (s.artist) { artists.add(s.artist); globalTerms.add(s.artist); }
                if (s.album) { albums.add(s.album); globalTerms.add(s.album); }
                if (s.genre) genres.add(s.genre);
                if (s.year) years.add(s.year);
                if (s.charter) charters.add(s.charter);
                if (s.playlist) sources.add(s.playlist);
                if (s.source) sources.add(s.source);
                // Optionally add song names to global, but might be too large
                // if (s.name) globalTerms.add(s.name);
            });

            const fillList = (id, set) => {
                const list = document.getElementById(id);
                
                // Fuzzy Deduplication: Normalize strings to remove punctuation/spacing differences
                const uniqueItems = [];
                const seen = new Set();
                // Sort by length descending to keep the most "complete" version (e.g. "Guns N' Roses" over "Guns N Roses")
                const sortedCandidates = Array.from(set).filter(Boolean).sort((a, b) => b.length - a.length);

                for (const item of sortedCandidates) {
                    const norm = item.toLowerCase().replace(/[^a-z0-9]/g, ''); // Remove non-alphanumeric
                    if (!seen.has(norm)) {
                        seen.add(norm);
                        uniqueItems.push(item);
                    }
                }
                
                list.innerHTML = uniqueItems.sort().map(v => `<option value="${v}">`).join('');
            };

            fillList('datalist-song', songs);
            fillList('datalist-artist', artists);
            fillList('datalist-album', albums);
            fillList('datalist-genre', genres);
            fillList('datalist-year', years);
            fillList('datalist-charter', charters);
            fillList('datalist-source', sources);
            fillList('datalist-global', globalTerms);
        }

        function clearFilters() {
            document.getElementById('search-global').value = '';
            document.getElementById('search-song').value = '';
            document.getElementById('search-artist').value = '';
            document.getElementById('search-album').value = '';
            document.getElementById('search-genre').value = '';
            document.getElementById('search-year').value = '';
            document.getElementById('search-charter').value = '';
            document.getElementById('search-source').value = '';
            selectedInstruments.clear();
            selectedInstruments.add('ALL');
            document.querySelectorAll('.inst-filter-btn').forEach(btn => {
                if (btn.getAttribute('data-inst') === 'ALL') btn.classList.add('active');
                else btn.classList.remove('active');
            });
            applyFilters();
            updateJumpBar();
        }

        function applyFilters() {
            const global = document.getElementById('search-global').value;
            const globalLower = global.toLowerCase();
            const song = document.getElementById('search-song').value.toLowerCase();
            const artist = document.getElementById('search-artist').value.toLowerCase();
            const album = document.getElementById('search-album').value.toLowerCase();
            const genre = document.getElementById('search-genre').value.toLowerCase();
            const year = document.getElementById('search-year').value.toLowerCase();
            const charter = document.getElementById('search-charter').value.toLowerCase();
            const source = document.getElementById('search-source').value.toLowerCase();

            // Use Fuse.js for global search if available and input exists
            let candidates = allSongs;
            if (global && fuse) {
                candidates = fuse.search(global).map(r => r.item);
            }

            filteredSongs = candidates.filter(s => {
                // Prevents errors with undefined fields
                const sName = (s.name || '').toLowerCase();
                const sArtist = (s.artist || '').toLowerCase();
                const sAlbum = (s.album || '').toLowerCase();
                const sGenre = (s.genre || '').toLowerCase();
                const sYear = (s.year || '').toString().toLowerCase();
                const sCharter = (s.charter || '').toLowerCase();
                const sPlaylist = (s.playlist || '').toLowerCase();
                const sSource = (s.source || '').toLowerCase();

                // Fallback manual check if fuse failed or not ready (unlikely)
                if (global && !fuse) {
                    if (!(sName.includes(globalLower) || sArtist.includes(globalLower) || sAlbum.includes(globalLower))) return false;
                }

                if (song && !sName.includes(song)) return false;
                if (artist && !sArtist.includes(artist)) return false;
                if (album && !sAlbum.includes(album)) return false;
                if (genre && !sGenre.includes(genre)) return false;
                if (year && !sYear.includes(year)) return false;
                if (charter && !sCharter.includes(charter)) return false;
                if (source && !(sSource.includes(source) || sPlaylist.includes(source))) return false;
                
                // Instrument Filter
                if (!selectedInstruments.has('ALL')) {
                    const required = Array.from(selectedInstruments);
                    const hasAll = required.every(reqInst => {
                        if (!s.parts) return false;
                        return s.parts.some(p => {
                            const icon = (p.icon || '').toLowerCase();
                            if (reqInst === 'guitar') return icon.includes('guitar');
                            if (reqInst === 'bass') return icon.includes('bass');
                            if (reqInst === 'drum') return icon.includes('drum');
                            if (reqInst === 'keys') return icon.includes('keys') || icon.includes('piano');
                            if (reqInst === 'vocals') return icon.includes('vocal') || icon.includes('harmony');
                            return false;
                        });
                    });
                    if (!hasAll) return false;
                }

                return true;
            });

            updateSearchChips();

            // Sorting
            filteredSongs.sort((a, b) => {
                let valA, valB;
                
                if (sortState.col === 'name') { valA = a.name; valB = b.name; }
                else if (sortState.col === 'artist') { valA = a.artist; valB = b.artist; }
                else if (sortState.col === 'instruments') { 
                    valA = (a.parts?.filter(p => !p.icon.toLowerCase().includes('pro')).length || 0); 
                    valB = (b.parts?.filter(p => !p.icon.toLowerCase().includes('pro')).length || 0); 
                }
                else if (sortState.col === 'isMaster') { valA = a.isMaster ? 1 : 0; valB = b.isMaster ? 1 : 0; }
                else if (sortState.col === 'album') { valA = a.album; valB = b.album; }
                else if (sortState.col === 'genre') { valA = a.genre; valB = b.genre; }
                else if (sortState.col === 'charter') { valA = a.charter; valB = b.charter; }
                else if (sortState.col === 'source') { valA = a.playlist; valB = b.playlist; }
                else if (sortState.col === 'year') { valA = parseInt(a.year) || 0; valB = parseInt(b.year) || 0; }
                else if (sortState.col === 'duration') { 
                    // Duration is string "MM:SS", convert to seconds for sort
                    const [mA, sA] = (a.duration || "0:00").split(':').map(Number);
                    const [mB, sB] = (b.duration || "0:00").split(':').map(Number);
                    valA = mA * 60 + sA;
                    valB = mB * 60 + sB;
                }

                if (valA < valB) return -1 * sortState.dir;
                if (valA > valB) return 1 * sortState.dir;
                return 0;
            });
            
            updateHeaderUI();
            
            // Update Results Count
            const countEl = document.getElementById('results-count');
            if (filteredSongs.length !== allSongs.length) {
                countEl.innerText = `${filteredSongs.length} songs of ${allSongs.length}`;
            } else {
                countEl.innerText = `${filteredSongs.length} songs`;
            }

            // Toggle Clear Button
            const hasFilters = global || song || artist || album || genre || year || charter || source || !selectedInstruments.has('ALL');
            const clearBtn = document.getElementById('clear-search-btn');
            if (clearBtn) {
                if (hasFilters) clearBtn.classList.remove('hidden');
                else clearBtn.classList.add('hidden');
            }
            
            currentDisplayCount = 0;
            renderedStartIndex = 0;
            lastGroupValue = null;
            updateJumpBar();
            document.getElementById('song-list').innerHTML = '';
            document.getElementById('view-grid').innerHTML = '';
            loadMore(); 
        }

        function toggleInstrument(inst) {
            if (inst === 'ALL') {
                selectedInstruments.clear();
                selectedInstruments.add('ALL');
            } else {
                if (selectedInstruments.has('ALL')) {
                    selectedInstruments.delete('ALL');
                }
                
                if (selectedInstruments.has(inst)) {
                    selectedInstruments.delete(inst);
                } else {
                    selectedInstruments.add(inst);
                }
                
                if (selectedInstruments.size === 0) {
                    selectedInstruments.add('ALL');
                }
            }
            
            document.querySelectorAll('.inst-filter-btn').forEach(btn => {
                const btnInst = btn.getAttribute('data-inst');
                if (selectedInstruments.has(btnInst)) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            
            applyFilters();
        }

        function updateSearchChips() {
            const container = document.getElementById('search-chips');
            const filters = [
                { id: 'search-song', label: 'Song' },
                { id: 'search-artist', label: 'Artist' },
                { id: 'search-album', label: 'Album' },
                { id: 'search-genre', label: 'Genre' },
                { id: 'search-year', label: 'Year' },
                { id: 'search-charter', label: 'Charter' },
                { id: 'search-source', label: 'Source' }
            ];

            let html = '';
            
            if (!selectedInstruments.has('ALL')) {
                const insts = Array.from(selectedInstruments).join(', ');
                html += `<span class="bg-slate-700 text-[10px] rounded px-1.5 py-0.5 flex items-center gap-1 whitespace-nowrap border border-slate-600 text-slate-200"><span class="font-bold text-slate-400">Inst:</span> "${insts}" <button onclick="toggleInstrument('ALL')" class="hover:text-white text-slate-400"><i data-lucide="x" class="w-3 h-3"></i></button></span>`;
            }

            html += filters.map(f => {

                if (!val) return '';
                return `<span class="bg-slate-700 text-[10px] rounded px-1.5 py-0.5 flex items-center gap-1 whitespace-nowrap border border-slate-600 text-slate-200">
                            <span class="font-bold text-slate-400">${f.label}:</span> "${val}"
                            <button onclick="removeFilter('${f.id}')" class="hover:text-white text-slate-400"><i data-lucide="x" class="w-3 h-3"></i></button>
                        </span>`;
            }).join('');
            
            container.innerHTML = html;
            lucide.createIcons();
        }

        function removeFilter(id) {
            document.getElementById(id).value = '';
            applyFilters();
        }

        function handleSortChange(val) {
            sortState.col = val;
            sortState.dir = 1; // Always reset to asc on change
            applyFilters();
        }

        function updateHeaderUI() {
            // Visibility
            document.querySelectorAll('th[data-col]').forEach(th => {
                const col = th.getAttribute('data-col');

                // Visibility
                if (columnState[col]) {
                    th.classList.remove('col-hidden');
                } else {
                    th.classList.add('col-hidden');
                }
            });
        }

        function updateJumpBar() {
            const bar = document.getElementById('jump-bar');
            const scroller = document.getElementById('fast-scroller');
            const groups = [];
            let last = null;

            // Only generate if we have a valid grouping column
            if (['name', 'artist', 'year', 'genre', 'charter', 'source', 'album', 'duration'].includes(sortState.col)) {
                filteredSongs.forEach((s, i) => {
                    const g = getGroupValue(s);
                    if (g !== null && g !== last) {
                        groups.push({ label: g, index: i });
                        last = g;
                    }
                });
            }
            currentGroups = groups;

            // Alphabet Logic: If > 20 groups and NOT Year, group by first letter
            if (groups.length > 20 && sortState.col !== 'year') {
                const alphaGroups = [];
                let lastChar = null;
                groups.forEach(g => {
                    let char = g.label.charAt(0).toUpperCase();
                    if (!/[A-Z]/.test(char)) char = '#';
                    // Only add if it's a new letter
                    if (char !== lastChar) {
                        alphaGroups.push({ label: char, index: g.index });
                        lastChar = char;
                    }
                });
                // Replace groups with alphaGroups for rendering
                if (alphaGroups.length > 1) { // Only replace if we actually have multiple letters
                    // We reuse the 'groups' variable name for rendering below
                    groups.splice(0, groups.length, ...alphaGroups);
                }
            }

            if (groups.length < 2) {
                bar.innerHTML = '';
                bar.classList.add('hidden');
                scroller.classList.add('hidden');
                return;
            }

            bar.classList.remove('hidden');
            bar.innerHTML = groups.map(g => 
                `<button onclick="jumpTo(${g.index})" class="px-3 py-1 bg-slate-800 hover:bg-accent hover:text-white rounded-full text-xs font-bold text-slate-400 whitespace-nowrap transition-colors border border-slate-700">${g.label}</button>`
            ).join('');
            
            /*
            // Update Fast Scroller
            scroller.classList.remove('hidden');
            // Sample groups if too many to fit visually, but logic uses all
            const maxVisual = 30; 
            let visualGroups = groups;
            if (groups.length > maxVisual) {
                visualGroups = groups.filter((_, i) => i % Math.ceil(groups.length / maxVisual) === 0);
            }
            
            scroller.innerHTML = visualGroups.map(g => 
                `<div class="flex-1 flex items-center justify-center w-full hover:text-white transition-colors cursor-pointer" onclick="jumpTo(${g.index})">${g.label.substring(0,1)}</div>`
            ).join('');
            */
        }

        function jumpTo(index) {
            currentDisplayCount = index;
            renderedStartIndex = index;
            lastGroupValue = null; // Reset so the header for this group renders immediately
            document.getElementById('song-list').innerHTML = '';
            document.getElementById('view-grid').innerHTML = '';
            document.getElementById('table-scroll-container').scrollTop = 0;
            loadMore();
        }

        function initColumnMenu() {
            const menu = document.getElementById('column-menu');
            menu.innerHTML = '';
            Object.keys(columnState).forEach(col => {
                if (col === 'name') return;
                const label = col.charAt(0).toUpperCase() + col.slice(1);
                const div = document.createElement('div');
                div.className = 'flex items-center gap-2 text-sm text-slate-300';
                div.innerHTML = `
                    <input type="checkbox" id="col-chk-${col}" ${columnState[col] ? 'checked' : ''} class="accent-accent cursor-pointer">
                    <label for="col-chk-${col}" class="cursor-pointer select-none flex-1">${label}</label>
                `;
                div.querySelector('input').addEventListener('change', (e) => {
                    columnState[col] = e.target.checked;
                    updateHeaderUI();
                    // Re-render visible rows to apply visibility
                    document.getElementById('song-list').innerHTML = '';
                    document.getElementById('view-grid').innerHTML = '';
                    currentDisplayCount = 0;
                    renderedStartIndex = 0;
                    loadMore();
                });
                menu.appendChild(div);
            });
        }

            menu.classList.toggle('flex');

            const el = document.getElementById('advanced-filters');
            el.classList.toggle('hidden');
        }

        function getInstrumentIcon(inst) {
            inst = inst.toLowerCase();
            if (inst.includes('guitar')) return 'guitar';
            if (inst.includes('bass')) return 'guitar';
            if (inst.includes('drum')) return 'drum';
            if (inst.includes('keys') || inst.includes('piano')) return 'piano';
            if (inst.includes('vocal') || inst.includes('harmony')) return 'mic';
            return 'music';
        }

        function getDifficultyColor(diff) {
            if (diff === 'Expert' || diff === 'ExpertPlus') return 'text-accent';
            return 'text-slate-500';
        }

        function getGroupValue(s) {
            const col = sortState.col;
            if (col === 'name' || col === 'album') {
                const val = (col === 'name' ? s.name : s.album) || '#';
                const char = val.charAt(0).toUpperCase();
                return /[A-Z]/.test(char) ? char : '#';
            }
            if (col === 'artist') return s.artist || 'Unknown Artist';
            if (col === 'year') {
                const y = parseInt(s.year);
                if (isNaN(y)) return 'Unknown Year';
                return Math.floor(y / 10) * 10 + 's';
            }
            if (col === 'genre') return s.genre || 'Unknown Genre';
            if (col === 'charter') return s.charter || 'Unknown Charter';
            if (col === 'source') return s.playlist || 'Unknown Source';
            if (col === 'duration') {
                const [m, sec] = (s.duration || "0:00").split(':').map(Number);
                const totalMin = m + (sec / 60);
                if (totalMin < 3) return "< 3m";
                if (totalMin < 6) return "3 ~ 6m";
                if (totalMin < 9) return "6 ~ 9m";
                if (totalMin < 12) return "9 ~ 12m";
                return "Over 12m";
            }
            return null;
        }

                                <div class="font-bold text-white text-base leading-tight truncate" title="${s.name || ''}">${s.name || '-'}</div>
                                <div class="text-accent text-xs font-bold truncate" title="${s.artist || ''}">${s.artist || '-'}</div>
                            </div>
                            
                            <div class="flex-1 flex flex-col gap-1 text-[10px] text-slate-300 overflow-hidden">
                                <div class="text-xs text-slate-400 leading-snug line-clamp-3 mb-1">
                                    ${infoString}
                                </div>
                                <div class="${columnState.instruments ? '' : 'col-hidden'} w-full flex items-center gap-2 border-t border-slate-700/50 pt-1">
                                    ${standardHtml} ${proHtml}
                                </div>
                            </div>
                        </div>
                    </div>
                    `;
                }
            }
            
            return html;
        }

        function loadMore() {
            const container = viewMode === 'list' ? document.getElementById('song-list') : document.getElementById('view-grid');
            const end = Math.min(currentDisplayCount + PAGE_SIZE, filteredSongs.length);
            
            if (filteredSongs.length === 0) {
                container.innerHTML = viewMode === 'list' 
                    ? `<tr><td colspan="6" class="p-8 text-center text-slate-500 italic">No songs found.</td></tr>`
                    : `<div class="col-span-full p-8 text-center text-slate-500 italic">No songs found.</div>`;
                return;
            }

            const html = renderRows(currentDisplayCount, end);
            // Using insertAdjacentHTML instead of appendChild in a loop for performance
            container.insertAdjacentHTML('beforeend', html);
            currentDisplayCount = end;
            
            // Observe the top element for scrolling up
            observeTopElement();
            observeImages();
            lucide.createIcons();
        }

        // Bidirectional Scroll Logic
        let topObserver = null;
        function observeTopElement() {
            if (topObserver) topObserver.disconnect();
            
            const container = viewMode === 'list' ? document.getElementById('song-list') : document.getElementById('view-grid');
            const firstEl = container.firstElementChild;
            
            if (firstEl && renderedStartIndex > 0) {
                topObserver = new IntersectionObserver((entries) => {
                    if (entries[0].isIntersecting) {
                        loadPrevious();
                    }
                }, { rootMargin: '200px' });
                topObserver.observe(firstEl);
            }
        }

        function loadPrevious() {
            if (renderedStartIndex <= 0) return;
            
            const container = viewMode === 'list' ? document.getElementById('song-list') : document.getElementById('view-grid');
            const scrollContainer = document.getElementById('table-scroll-container');
            
            const start = Math.max(0, renderedStartIndex - PAGE_SIZE);
            const end = renderedStartIndex;
            
            const oldScrollHeight = scrollContainer.scrollHeight;
            
            const html = renderRows(start, end);
            container.insertAdjacentHTML('afterbegin', html);
            
            renderedStartIndex = start;
            
            // Adjust scroll position to maintain visual stability
            const newScrollHeight = scrollContainer.scrollHeight;
            scrollContainer.scrollTop += (newScrollHeight - oldScrollHeight);
            
            observeTopElement();
            observeImages();
            lucide.createIcons();
        }

        function observeImages() {
            if (!imageObserver) return;
            const imgs = document.querySelectorAll('img.lazy-img');
            imgs.forEach(img => imageObserver.observe(img));
        }

        // Modal Logic // Close by clicking outside
        const modal = document.getElementById('song-modal');
        const modalContent = document.getElementById('modal-content');

        function openModal(index) {
            const s = filteredSongs[index];
            if (!s) return;

            // Setup Image
            const img = document.getElementById('modal-img');
            const baseUrl = document.getElementById('api-url').value.trim();
            img.style.display = 'block';
            img.src = `${baseUrl}/album-art?song=${s.fullHash}&t=${Date.now()}`; // t param prevents caching issues if needed

            currentSongHash = s.fullHash;

            document.getElementById('modal-title').innerText = s.name || 'Unknown';
            document.getElementById('modal-artist').innerText = s.artist || 'Unknown';
            document.getElementById('modal-album').innerText = s.album || '-';
            document.getElementById('modal-year').innerText = s.year || '-';
            document.getElementById('modal-genre').innerText = s.genre || '-';
            document.getElementById('modal-duration').innerText = s.duration; 
            document.getElementById('modal-charter').innerText = s.charter || '-';
            document.getElementById('modal-ismaster').innerText = s.isMaster ? 'Master' : 'Not Master';
            
            // We display Playlist in the Source field to match in-game UI behavior
            document.getElementById('modal-source').innerText = s.playlist || '-';
            
            // Render Parts & Difficulties
            const partsContainer = document.getElementById('modal-parts-container');
            partsContainer.innerHTML = '';
            if (s.parts && Array.isArray(s.parts)) {
                s.parts.forEach(p => {
                    const icon = getInstrumentIcon(p.icon);
                    const diffsHtml = p.difficulties.map(d => `<span class="${getDifficultyColor(d)}">${d.substring(0,1)}</span>`).join(' ');
                    
                    const badge = document.createElement('div');
                    badge.className = 'bg-slate-700/50 border border-slate-600 rounded px-2 py-1 flex items-center gap-2 text-xs';
                    badge.title = p.icon;
                    badge.innerHTML = `<i data-lucide="${icon}" class="w-3 h-3 text-slate-300"></i> <span class="font-mono font-bold tracking-widest">${diffsHtml}</span>`;
                    partsContainer.appendChild(badge);
                });
            }

            lucide.createIcons();
            modal.classList.add('open');
            // Small delay for transition
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            document.getElementById('modal-img').src = ''; // Clear image
            setTimeout(() => {
                modal.classList.remove('open');
                currentSongHash = null;
            }, 200);
        }

        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        // Play Button Action
        document.getElementById('modal-play-btn').addEventListener('click', async () => {
            if (!currentSongHash) return;
            const btn = document.getElementById('modal-play-btn');
            const originalContent = btn.innerHTML;
            
            btn.innerHTML = `<i data-lucide="loader-2" class="w-7 h-7 animate-spin"></i>`;
            btn.disabled = true;
            lucide.createIcons();
            
            const baseUrl = document.getElementById('api-url').value.trim();
            try {
                const response = await fetch(`${baseUrl}/play?song=${currentSongHash}`, {
                    method: 'POST'
                });
                
                if (response.ok) { 
                    showToast("Song sent to play!");
                    closeModal(); 
                } else {
                    throw new Error(`Error ${response.status}`);
                }
            } catch (err) {
                console.error(err);
                alert(`Failed to play song: ${err.message}`);
            } finally {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                lucide.createIcons();
            }
        });

        async function playSong(e, hash) {
            e.stopPropagation();
            if (!hash) return;
            
            const btn = e.currentTarget;
            const originalContent = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>`;
            btn.disabled = true;
            lucide.createIcons();

            const baseUrl = document.getElementById('api-url').value.trim();
            try {
                const response = await fetch(`${baseUrl}/play?song=${hash}`, {
                    method: 'POST'
                });
                
                if (response.ok) { 
                    showToast("Song sent to play!");
                } else {
                    throw new Error(`Error ${response.status}`);
                }
            } catch (err) {
                console.error(err);
                showToast(`Failed: ${err.message}`);
            } finally {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                lucide.createIcons();
            }
        }

        // Toast Notification
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg; 
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Initial load and periodic ping
        document.addEventListener('DOMContentLoaded', () => {
            initColumnMenu();
            
            // Close column menu when clicking outside
            document.addEventListener('click', (e) => {
                const colMenu = document.getElementById('column-menu');
                const colBtn = document.querySelector('button[onclick="toggleColumnMenu()"]');
                if (colMenu && !colMenu.contains(e.target) && !colBtn.contains(e.target)) {
                    colMenu.classList.add('hidden');
                    colMenu.classList.remove('flex');
                }
                
                const advMenu = document.getElementById('advanced-filters');
                const advBtn = document.querySelector('button[onclick="toggleAdvancedFilters()"]');
                if (advMenu && !advMenu.contains(e.target) && !advBtn.contains(e.target) && !document.getElementById('search-global').contains(e.target)) {
                    advMenu.classList.add('hidden');
                }
            });

            pingServer(); // Check immediately
            pingInterval = setInterval(pingServer, 2000); // Check every 2 seconds
            
            // Infinite Scroll
            const sentinel = document.getElementById('scroll-sentinel');
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) {
                    loadMore();
                }
            }, { rootMargin: '200px' });
            if (sentinel) observer.observe(sentinel);

            // Image Observer
            imageObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        if (img.dataset.src) {
                            img.src = img.dataset.src;
                            img.removeAttribute('data-src');
                            img.classList.remove('lazy-img');
                            observer.unobserve(img);
                        }
                    }
                });
            }, { rootMargin: '500px' });
        });
    </script>
</body>
</html>
