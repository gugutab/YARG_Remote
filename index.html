<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YARG Remote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        card: '#1e293b',
                        accent: '#3b82f6',
                        accentHover: '#2563eb'
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        body { background-color: #0f172a; color: #f8fafc; overflow: hidden; }
        
        .modal {
            display: none;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 50;
            align-items: center; justify-content: center;
        }
        .modal.open { display: flex; }
        
        .sort-asc::after { content: " \25B2"; font-size: 0.8em; opacity: 0.7; margin-left: 4px; }
        .sort-desc::after { content: " \25BC"; font-size: 0.8em; opacity: 0.7; margin-left: 4px; }
        .sort-active { @apply border-accent text-accent; }
        .col-hidden { display: none !important; }
    </style>
</head>
<body class="h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-card border-b border-slate-700 p-4 sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-black italic uppercase tracking-tighter flex items-center gap-2">
                <i data-lucide="gamepad-2" class="text-accent"></i>
                YARG <span class="text-accent">Remote</span>
            </h1> 
            
            <!-- Search Bar & Filters -->
            <div class="flex-1 max-w-xl w-full mx-4 relative group">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="search-global" list="datalist-global" oninput="applyFilters()" placeholder="Search song, artist, album..." class="w-full bg-dark border border-slate-600 rounded-lg py-1.5 pl-9 pr-9 text-sm text-white focus:border-accent outline-none transition-colors">
                    <button onclick="toggleAdvancedFilters()" class="absolute right-2 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-white p-1 rounded-md hover:bg-slate-700 transition-colors" title="Advanced Filters">
                        <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
                    </button>
                </div>
            
                <!-- Expanded Search Area -->
                <div id="advanced-filters" class="hidden absolute top-full left-0 right-0 mt-2 bg-card border border-slate-700 rounded-xl shadow-2xl p-4 z-50 flex flex-col gap-4">
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Artist</label><input type="text" id="search-artist" list="datalist-artist" oninput="applyFilters()" class="w-full bg-dark border border-slate-600 rounded-md px-2 py-1 text-xs text-white focus:border-accent outline-none"></div>
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Genre</label><input type="text" id="search-genre" list="datalist-genre" oninput="applyFilters()" class="w-full bg-dark border border-slate-600 rounded-md px-2 py-1 text-xs text-white focus:border-accent outline-none"></div>
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Year</label><input type="text" id="search-year" list="datalist-year" oninput="applyFilters()" class="w-full bg-dark border border-slate-600 rounded-md px-2 py-1 text-xs text-white focus:border-accent outline-none"></div>
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Charter</label><input type="text" id="search-charter" list="datalist-charter" oninput="applyFilters()" class="w-full bg-dark border border-slate-600 rounded-md px-2 py-1 text-xs text-white focus:border-accent outline-none"></div>
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Playlist</label><input type="text" id="search-playlist" list="datalist-playlist" oninput="applyFilters()" class="w-full bg-dark border border-slate-600 rounded-md px-2 py-1 text-xs text-white focus:border-accent outline-none"></div>
                        <div><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1 block">Source</label><input type="text" id="search-source" list="datalist-source" oninput="applyFilters()" class="w-full bg-dark border border-slate-600 rounded-md px-2 py-1 text-xs text-white focus:border-accent outline-none"></div>
                    </div>
                    <div class="border-t border-slate-700 pt-3">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 block">Sort By</label>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="toggleSort('name')" class="text-xs bg-dark border border-slate-600 px-2 py-1 rounded hover:border-accent transition-colors" data-sort="name">Song</button>
                            <button onclick="toggleSort('artist')" class="text-xs bg-dark border border-slate-600 px-2 py-1 rounded hover:border-accent transition-colors" data-sort="artist">Artist</button>
                            <button onclick="toggleSort('album')" class="text-xs bg-dark border border-slate-600 px-2 py-1 rounded hover:border-accent transition-colors" data-sort="album">Album</button>
                            <button onclick="toggleSort('genre')" class="text-xs bg-dark border border-slate-600 px-2 py-1 rounded hover:border-accent transition-colors" data-sort="genre">Genre</button>
                            <button onclick="toggleSort('year')" class="text-xs bg-dark border border-slate-600 px-2 py-1 rounded hover:border-accent transition-colors" data-sort="year">Year</button>
                            <button onclick="toggleSort('duration')" class="text-xs bg-dark border border-slate-600 px-2 py-1 rounded hover:border-accent transition-colors" data-sort="duration">Duration</button>
                            <button onclick="toggleSort('instruments')" class="text-xs bg-dark border border-slate-600 px-2 py-1 rounded hover:border-accent transition-colors" data-sort="instruments">Inst</button>
                            <button onclick="toggleSort('charter')" class="text-xs bg-dark border border-slate-600 px-2 py-1 rounded hover:border-accent transition-colors" data-sort="charter">Charter</button>
                            <button onclick="toggleSort('playlist')" class="text-xs bg-dark border border-slate-600 px-2 py-1 rounded hover:border-accent transition-colors" data-sort="playlist">Playlist</button>
                            <button onclick="toggleSort('source')" class="text-xs bg-dark border border-slate-600 px-2 py-1 rounded hover:border-accent transition-colors" data-sort="source">Source</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-2 w-full md:w-auto">
                <div class="flex bg-dark rounded-lg border border-slate-600 overflow-hidden px-2 py-1 items-center flex-1 md:w-80">
                    <div id="connection-status" class="w-3 h-3 rounded-full bg-rose-500 mr-2 transition-all duration-500 shadow-none" title="Disconnected"></div>
                    <input type="text" id="api-url" class="bg-transparent border-none outline-none text-sm w-full text-white" value="http://localhost:8080" placeholder="API URL">
                </div>
                <button id="action-btn" onclick="handleConnectionToggle()" class="text-slate-400 hover:text-white p-2 rounded-lg transition-colors" title="Connecting...">
                    <i data-lucide="loader-2" class="w-5 h-5 animate-spin" id="action-icon"></i> 
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto w-full p-4 flex flex-col gap-4 overflow-hidden">
        
        <!-- Toolbar -->
        <div class="flex justify-between items-center bg-card rounded-xl p-3 border border-slate-700 shadow-sm">
                <span id="results-count" class="text-xs font-bold text-slate-400 bg-dark px-3 py-1 rounded-full border border-slate-700">0 songs</span> 
                <div class="flex gap-4 items-center">
                    <div class="relative">
                        <button onclick="toggleColumnMenu()" class="text-xs font-bold text-slate-400 hover:text-white flex items-center gap-1 bg-dark px-2 py-1 rounded border border-slate-700">
                            <i data-lucide="columns" class="w-3 h-3"></i> Columns
                        </button>
                        <div id="column-menu" class="hidden absolute right-0 top-8 bg-card border border-slate-700 p-3 rounded-lg shadow-xl z-50 min-w-[160px] flex-col gap-2">
                            <!-- Checkboxes injected via JS -->
                        </div>
                    </div>
                    <button onclick="clearFilters()" class="text-xs font-bold text-slate-400 hover:text-white underline">Clear Filters</button>
                </div>
        </div>

        <!-- Table/List -->
        <div class="bg-card rounded-xl border border-slate-700 shadow-sm flex-1 flex flex-col min-h-0 relative">
            <div class="overflow-auto flex-1 h-full" id="table-scroll-container">
                <table class="w-full text-left border-collapse relative">
                    <thead class="bg-card sticky top-0 z-10 shadow-sm">
                        <tr class="text-xs uppercase tracking-widest text-slate-400 border-b border-slate-700"> 
                            <th class="p-4 font-bold select-none transition-colors" data-col="name">
                                <span class="cursor-pointer hover:text-accent" onclick="toggleSort('name'); event.stopPropagation()" data-sort="name">Song</span> / 
                                <span class="cursor-pointer hover:text-accent" onclick="toggleSort('artist'); event.stopPropagation()" data-sort="artist">Artist</span>
                            </th> 
                            <th class="p-4 font-bold text-center cursor-pointer hover:text-accent select-none transition-colors" onclick="toggleSort('instruments')" data-col="instruments" data-sort="instruments">Instruments</th> 
                            <th class="p-4 font-bold text-center cursor-pointer hover:text-accent select-none transition-colors" onclick="toggleSort('pro')" data-col="pro" data-sort="pro">Pro</th> 
                            <th class="p-4 font-bold text-center cursor-pointer hover:text-accent select-none transition-colors" onclick="toggleSort('isMaster')" data-col="isMaster" data-sort="isMaster">Is Master</th> 
                            <th class="p-4 font-bold cursor-pointer hover:text-accent select-none transition-colors hidden md:table-cell" onclick="toggleSort('album')" data-col="album" data-sort="album">Album</th> 
                            <th class="p-4 font-bold cursor-pointer hover:text-accent select-none transition-colors hidden lg:table-cell" onclick="toggleSort('genre')" data-col="genre" data-sort="genre">Genre/Sub</th> 
                            <th class="p-4 font-bold cursor-pointer hover:text-accent select-none transition-colors hidden xl:table-cell" onclick="toggleSort('charter')" data-col="charter" data-sort="charter">Charter</th> 
                            <th class="p-4 font-bold cursor-pointer hover:text-accent select-none transition-colors hidden 2xl:table-cell" onclick="toggleSort('playlist')" data-col="playlist" data-sort="playlist">Playlist</th> 
                            <th class="p-4 font-bold cursor-pointer hover:text-accent select-none transition-colors hidden 2xl:table-cell" onclick="toggleSort('source')" data-col="source" data-sort="source">Source</th> 
                            <th class="p-4 font-bold cursor-pointer hover:text-accent select-none transition-colors hidden sm:table-cell" onclick="toggleSort('year')" data-col="year" data-sort="year">Year</th> 
                            <th class="p-4 font-bold text-right cursor-pointer hover:text-accent select-none transition-colors" onclick="toggleSort('duration')" data-col="duration" data-sort="duration">Duration</th> 
                        </tr>
                    </thead>
                    <tbody id="song-list" class="text-sm divide-y divide-slate-700/50 bg-card">
                        <tr><td colspan="6" class="p-8 text-center text-slate-500 italic">Enter API URL and click Load.</td></tr> 
                    </tbody>
                </table>
                <!-- Infinite Scroll Sentinel inside the scroll container -->
                <div id="scroll-sentinel" class="h-10 w-full"></div>
            </div>
        </div>

    </main>

    <!-- Modal -->
    <div id="song-modal" class="modal">
        <div class="bg-card rounded-2xl w-full max-w-lg border border-slate-600 shadow-2xl overflow-hidden transform transition-all scale-95 opacity-0" id="modal-content" style="transition: all 0.2s;">
            
            <div class="p-6 border-b border-slate-700 flex justify-between items-start bg-slate-800/30"> 
                <div class="flex gap-4 items-center">
                    <img id="modal-img" src="" class="w-48 h-48 rounded-lg shadow-lg bg-slate-900 object-cover" alt="Album Art" onerror="this.style.display='none'">
                    <div> 
                    <h2 id="modal-title" class="text-2xl font-black italic text-white leading-tight">Song Name</h2> 
                    <p id="modal-artist" class="text-accent font-bold text-lg mt-1">Artist</p> 
                    </div>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1"><i data-lucide="x"></i></button> 
            </div> 
            
            <div class="p-6 grid grid-cols-2 gap-y-4 gap-x-6 text-sm"> 
                <div> 
                    <span class="block text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-1">Album</span> 
                    <span id="modal-album" class="text-white font-medium">...</span> 
                </div> 
                <div> 
                    <span class="block text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-1">Year</span> 
                    <span id="modal-year" class="text-white font-medium">...</span> 
                </div> 
                <div> 
                    <span class="block text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-1">Genre</span> 
                    <span id="modal-genre" class="text-white font-medium">...</span> 
                </div> 
                <div> 
                    <span class="block text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-1">Duration</span> 
                    <span id="modal-duration" class="text-white font-medium">...</span> 
                </div> 
                <div> 
                    <span class="block text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-1">Charter</span> 
                    <span id="modal-charter" class="text-white font-medium">...</span> 
                </div> 
                <div> 
                    <span class="block text-[10px] uppercase tracking-widest text-slate-500 font-bold mb-1">Source</span> 
                    <span id="modal-source" class="text-white font-medium">...</span> 
                </div>
            </div>
            
            <div id="modal-parts-container" class="px-6 pb-4 flex flex-wrap gap-2">
                <!-- Parts injected here via JS -->
            </div>
            
            <div class="p-6 bg-slate-800/50 border-t border-slate-700 flex justify-end gap-3">
                <button id="modal-play-btn" class="bg-accent hover:bg-accentHover text-white px-8 py-2 rounded-lg font-bold flex items-center gap-2 transition-colors shadow-lg shadow-accent/20">
                    <i data-lucide="play" class="w-5 h-5 fill-current"></i>
                    PLAY NOW
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 right-4 bg-emerald-500 text-white px-4 py-3 rounded-lg shadow-xl font-bold text-sm transform translate-y-20 opacity-0 transition-all z-50 flex items-center gap-2"> 
        <i data-lucide="check-circle" class="w-5 h-5"></i> 
        <span id="toast-msg">Success!</span> 
    </div>

    <!-- Datalists for Autocomplete -->
    <datalist id="datalist-global"></datalist>
    <datalist id="datalist-artist"></datalist>
    <datalist id="datalist-genre"></datalist>
    <datalist id="datalist-year"></datalist>
    <datalist id="datalist-charter"></datalist>
    <datalist id="datalist-playlist"></datalist>
    <datalist id="datalist-source"></datalist>

    <script>
        lucide.createIcons();

        let allSongs = [];
        let filteredSongs = [];
        let currentDisplayCount = 0;
        const PAGE_SIZE = 100;
        let currentSongHash = null;
        let isConnected = false;
        let pingInterval = null;
        let fuse = null;
        
        // Sorting & Columns State
        let sortState = { col: 'name', dir: 1 }; // 1 = asc, -1 = desc
        let columnState = {
            name: true,
            instruments: true,
            pro: true,
            isMaster: false,
            album: true,
            genre: true,
            charter: true,
            playlist: false,
            source: false,
            year: true,
            duration: false
        };

        function updateConnectionUI(connected) {
            const btn = document.getElementById('action-btn');
            const statusDot = document.getElementById('connection-status');

            if (connected) {
                statusDot.classList.remove('bg-rose-500', 'shadow-none');
                statusDot.classList.add('bg-emerald-500', 'shadow-[0_0_10px_#10b981]');
                statusDot.title = "Connected";

                btn.className = "text-rose-500 hover:text-rose-400 p-2 rounded-lg transition-colors";
                btn.title = "Disconnect";
                btn.innerHTML = `<i data-lucide="log-out" class="w-5 h-5" id="action-icon"></i>`;
            } else {
                statusDot.classList.remove('bg-emerald-500', 'shadow-[0_0_10px_#10b981]');
                statusDot.classList.add('bg-rose-500', 'shadow-none');
                statusDot.title = "Disconnected";

                btn.className = "text-slate-400 hover:text-white p-2 rounded-lg transition-colors";
                btn.title = "Connect";
                btn.innerHTML = `<i data-lucide="log-in" class="w-5 h-5" id="action-icon"></i>`;
            }
            lucide.createIcons();
        }

        function handleConnectionToggle() {
            if (isConnected) {
                // Disconnect logic
                isConnected = false;
                if (pingInterval) {
                    clearInterval(pingInterval);
                    pingInterval = null;
                }
                
                // Clear songs
                allSongs = [];
                filteredSongs = [];
                document.getElementById('song-list').innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500 italic">Disconnected.</td></tr>`;
                document.getElementById('results-count').innerText = '0 songs';

                updateConnectionUI(false);
                showToast("Disconnected");
            } else {
                // Connect logic
                fetchSongs();
                if (!pingInterval) {
                    pingInterval = setInterval(pingServer, 2000);
                }
            }
        }

        async function pingServer() {
            const url = document.getElementById('api-url').value.trim();
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000);
                
                const response = await fetch(`${url}/ping`, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (response.ok) {
                    if (!isConnected) {
                        isConnected = true;
                        updateConnectionUI(true);
                        
                        // Auto-load songs if connected and list is empty
                        if (allSongs.length === 0) fetchSongs();
                    }
                } else {
                    throw new Error('Ping failed');
                }
            } catch (err) {
                if (isConnected) {
                    isConnected = false;
                    updateConnectionUI(false);
                } else {
                    const btn = document.getElementById('action-btn');
                    if (btn && btn.innerHTML.includes('loader-2')) updateConnectionUI(false);
                }
            }
        }

        async function fetchSongs() {
            const url = document.getElementById('api-url').value.trim();
            const btn = document.getElementById('action-btn');
            
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin" id="action-icon"></i>`;
            document.getElementById('song-list').innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i>Loading songs...</td></tr>`;
            lucide.createIcons();
            
            try {
                const response = await fetch(`${url}/songs`);
                if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
                const data = await response.json();

                allSongs = data;
                
                // Initialize Fuzzy Search
                fuse = new Fuse(allSongs, {
                    keys: ['name', 'artist', 'album'],
                    threshold: 0.3, // 0.0 = exact match, 1.0 = match anything
                    ignoreLocation: true
                });

                initColumnMenu();
                populateAutocomplete();
                applyFilters();
                showToast(`Loaded ${allSongs.length} songs.`);
                
                isConnected = true;
                updateConnectionUI(true);
                if (!pingInterval) pingInterval = setInterval(pingServer, 2000);
            } catch (err) {
                console.error(err);
                document.getElementById('song-list').innerHTML = `<tr><td colspan="6" class="p-8 text-center text-rose-400 font-bold bg-rose-500/10">Error loading: ${err.message}<br><span class="text-xs font-normal text-slate-400">Check if the server is running and the URL is correct. (CORS issues may also occur)</span></td></tr>`;
                
                isConnected = false;
                updateConnectionUI(false);
            }
        }

        function populateAutocomplete() {
            const artists = new Set();
            const genres = new Set();
            const years = new Set();
            const charters = new Set();
            const playlists = new Set();
            const sources = new Set();
            const globalTerms = new Set();

            allSongs.forEach(s => {
                if (s.artist) { artists.add(s.artist); globalTerms.add(s.artist); }
                if (s.genre) genres.add(s.genre);
                if (s.year) years.add(s.year);
                if (s.charter) charters.add(s.charter);
                if (s.playlist) playlists.add(s.playlist);
                if (s.source) sources.add(s.source);
                if (s.album) globalTerms.add(s.album);
                // Optionally add song names to global, but might be too large
                // if (s.name) globalTerms.add(s.name);
            });

            const fillList = (id, set) => {
                const list = document.getElementById(id);
                
                // Fuzzy Deduplication: Normalize strings to remove punctuation/spacing differences
                const uniqueItems = [];
                const seen = new Set();
                // Sort by length descending to keep the most "complete" version (e.g. "Guns N' Roses" over "Guns N Roses")
                const sortedCandidates = Array.from(set).filter(Boolean).sort((a, b) => b.length - a.length);

                for (const item of sortedCandidates) {
                    const norm = item.toLowerCase().replace(/[^a-z0-9]/g, ''); // Remove non-alphanumeric
                    if (!seen.has(norm)) {
                        seen.add(norm);
                        uniqueItems.push(item);
                    }
                }
                
                list.innerHTML = uniqueItems.sort().map(v => `<option value="${v}">`).join('');
            };

            fillList('datalist-artist', artists);
            fillList('datalist-genre', genres);
            fillList('datalist-year', years);
            fillList('datalist-charter', charters);
            fillList('datalist-playlist', playlists);
            fillList('datalist-source', sources);
            fillList('datalist-global', globalTerms);
        }

        function clearFilters() {
            document.getElementById('search-global').value = '';
            document.getElementById('search-artist').value = '';
            document.getElementById('search-genre').value = '';
            document.getElementById('search-year').value = '';
            document.getElementById('search-charter').value = '';
            document.getElementById('search-playlist').value = '';
            document.getElementById('search-source').value = '';
            applyFilters();
        }

        function applyFilters() {
            const global = document.getElementById('search-global').value;
            const globalLower = global.toLowerCase();
            const artist = document.getElementById('search-artist').value.toLowerCase();
            const genre = document.getElementById('search-genre').value.toLowerCase();
            const year = document.getElementById('search-year').value.toLowerCase();
            const charter = document.getElementById('search-charter').value.toLowerCase();
            const playlist = document.getElementById('search-playlist').value.toLowerCase();
            const source = document.getElementById('search-source').value.toLowerCase();

            // Use Fuse.js for global search if available and input exists
            let candidates = allSongs;
            if (global && fuse) {
                candidates = fuse.search(global).map(r => r.item);
            }

            filteredSongs = candidates.filter(s => {
                // Prevents errors with undefined fields
                // const sName = (s.name || '').toLowerCase(); // Handled by Fuse
                const sArtist = (s.artist || '').toLowerCase();
                // const sAlbum = (s.album || '').toLowerCase(); // Handled by Fuse
                const sGenre = (s.genre || '').toLowerCase();
                const sYear = (s.year || '').toString().toLowerCase();
                const sCharter = (s.charter || '').toLowerCase();
                const sPlaylist = (s.playlist || '').toLowerCase();
                const sSource = (s.source || '').toLowerCase();

                // Fallback manual check if fuse failed or not ready (unlikely)
                if (global && !fuse) {
                    const sName = (s.name || '').toLowerCase();
                    const sAlbum = (s.album || '').toLowerCase();
                    if (!(sName.includes(globalLower) || sArtist.includes(globalLower) || sAlbum.includes(globalLower))) return false;
                }

                if (artist && !sArtist.includes(artist)) return false;
                if (genre && !sGenre.includes(genre)) return false;
                if (year && !sYear.includes(year)) return false;
                if (charter && !sCharter.includes(charter)) return false;
                if (playlist && !sPlaylist.includes(playlist)) return false;
                if (source && !sSource.includes(source)) return false;
                
                return true;
            });

            // Sorting
            filteredSongs.sort((a, b) => {
                let valA, valB;
                
                if (sortState.col === 'name') { valA = a.name; valB = b.name; }
                else if (sortState.col === 'artist') { valA = a.artist; valB = b.artist; }
                else if (sortState.col === 'instruments') { 
                    valA = (a.parts?.filter(p => !p.icon.toLowerCase().includes('pro')).length || 0); 
                    valB = (b.parts?.filter(p => !p.icon.toLowerCase().includes('pro')).length || 0); 
                }
                else if (sortState.col === 'pro') { 
                    valA = (a.parts?.filter(p => p.icon.toLowerCase().includes('pro')).length || 0); 
                    valB = (b.parts?.filter(p => p.icon.toLowerCase().includes('pro')).length || 0); 
                }
                else if (sortState.col === 'isMaster') { valA = a.isMaster ? 1 : 0; valB = b.isMaster ? 1 : 0; }
                else if (sortState.col === 'album') { valA = a.album; valB = b.album; }
                else if (sortState.col === 'genre') { valA = a.genre; valB = b.genre; }
                else if (sortState.col === 'charter') { valA = a.charter; valB = b.charter; }
                else if (sortState.col === 'playlist') { valA = a.playlist; valB = b.playlist; }
                else if (sortState.col === 'source') { valA = a.source; valB = b.source; }
                else if (sortState.col === 'year') { valA = parseInt(a.year) || 0; valB = parseInt(b.year) || 0; }
                else if (sortState.col === 'duration') { 
                    // Duration is string "MM:SS", convert to seconds for sort
                    const [mA, sA] = (a.duration || "0:00").split(':').map(Number);
                    const [mB, sB] = (b.duration || "0:00").split(':').map(Number);
                    valA = mA * 60 + sA;
                    valB = mB * 60 + sB;
                }

                if (valA < valB) return -1 * sortState.dir;
                if (valA > valB) return 1 * sortState.dir;
                return 0;
            });
            
            updateHeaderUI();
            
            document.getElementById('results-count').innerText = `${filteredSongs.length} songs`;
            
            currentDisplayCount = 0;
            document.getElementById('song-list').innerHTML = '';
            loadMore(); 
        }

        function toggleSort(col) {
            if (sortState.col === col) {
                sortState.dir *= -1;
            } else {
                sortState.col = col;
                sortState.dir = 1;
            }
            applyFilters();
        }

        function updateHeaderUI() {
            // Reset sort indicators
            document.querySelectorAll('[data-sort]').forEach(el => {
                el.classList.remove('sort-asc', 'sort-desc', 'text-accent', 'sort-active');
            });

            // Set active sort
            const activeEls = document.querySelectorAll(`[data-sort="${sortState.col}"]`);
            activeEls.forEach(activeEl => {
                activeEl.classList.add(sortState.dir === 1 ? 'sort-asc' : 'sort-desc');
                activeEl.classList.add('text-accent');
                if(activeEl.tagName === 'BUTTON') activeEl.classList.add('sort-active');
            });

            // Visibility
            document.querySelectorAll('th[data-col]').forEach(th => {
                const col = th.getAttribute('data-col');

                // Visibility
                if (columnState[col]) {
                    th.classList.remove('col-hidden');
                } else {
                    th.classList.add('col-hidden');
                }
            });
        }

        function initColumnMenu() {
            const menu = document.getElementById('column-menu');
            menu.innerHTML = '';
            Object.keys(columnState).forEach(col => {
                if (col === 'name') return;
                const label = col.charAt(0).toUpperCase() + col.slice(1);
                const div = document.createElement('div');
                div.className = 'flex items-center gap-2 text-sm text-slate-300';
                div.innerHTML = `
                    <input type="checkbox" id="col-chk-${col}" ${columnState[col] ? 'checked' : ''} class="accent-accent cursor-pointer">
                    <label for="col-chk-${col}" class="cursor-pointer select-none flex-1">${label}</label>
                `;
                div.querySelector('input').addEventListener('change', (e) => {
                    columnState[col] = e.target.checked;
                    updateHeaderUI();
                    // Re-render visible rows to apply visibility
                    document.getElementById('song-list').innerHTML = '';
                    currentDisplayCount = 0;
                    loadMore();
                });
                menu.appendChild(div);
            });
        }

        function toggleColumnMenu() {
            const menu = document.getElementById('column-menu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        function toggleAdvancedFilters() {
            const el = document.getElementById('advanced-filters');
            el.classList.toggle('hidden');
        }

        function getInstrumentIcon(inst) {
            inst = inst.toLowerCase();
            if (inst.includes('guitar')) return 'guitar';
            if (inst.includes('bass')) return 'guitar';
            if (inst.includes('drum')) return 'drum';
            if (inst.includes('keys') || inst.includes('piano')) return 'piano';
            if (inst.includes('vocal') || inst.includes('harmony')) return 'mic';
            return 'music';
        }

        function getDifficultyColor(diff) {
            if (diff === 'Expert' || diff === 'ExpertPlus') return 'text-rose-400';
            if (diff === 'Hard') return 'text-orange-400';
            if (diff === 'Medium') return 'text-yellow-400';
            return 'text-emerald-400';
        }

        function getGroupKey(s, col) {
            if (!s) return null;
            
            if (col === 'name') {
                const val = (s.name || '').trim();
                if (!val) return '#';
                const first = val.charAt(0).toUpperCase();
                return first.match(/[A-Z]/) ? first : '#';
            }
            if (col === 'artist') return s.artist || 'Unknown Artist';
            if (col === 'album') return s.album || 'Unknown Album';
            if (col === 'genre') return s.genre || 'Unknown Genre';
            if (col === 'year') {
                const y = parseInt(s.year);
                if (isNaN(y)) return 'Unknown Year';
                return Math.floor(y / 10) * 10 + 's';
            }
            if (col === 'charter') return s.charter || 'Unknown Charter';
            if (col === 'playlist') return s.playlist || 'Unknown Playlist';
            if (col === 'source') return (typeof s.source === 'string' ? s.source : (s.source?.Original || 'Unknown Source')) || 'Unknown Source';
            
            return null;
        }

        function loadMore() {
            const tbody = document.getElementById('song-list');
            const end = Math.min(currentDisplayCount + PAGE_SIZE, filteredSongs.length);
            const baseUrl = document.getElementById('api-url').value.trim();
            
            if (filteredSongs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" class="p-8 text-center text-slate-500 italic">No songs found.</td></tr>`;
                return;
            }

            let html = '';
            for (let i = currentDisplayCount; i < end; i++) {
                const s = filteredSongs[i];
                
                // Subheader Logic
                const currentKey = getGroupKey(s, sortState.col);
                const prev = i > 0 ? filteredSongs[i-1] : null;
                const prevKey = prev ? getGroupKey(prev, sortState.col) : null;
                
                if (currentKey && currentKey !== prevKey) {
                    html += `<tr class="bg-slate-800/95 text-xs font-bold uppercase tracking-widest text-accent sticky top-[53px] z-0 shadow-sm backdrop-blur-sm"><td colspan="11" class="px-4 py-2 border-b border-slate-700/50">${currentKey}</td></tr>`;
                }
                
                // Generate icons HTML
                let standardHtml = '';
                let proHtml = '';
                if (s.parts && Array.isArray(s.parts)) {
                    const standard = s.parts.filter(p => !p.icon.toLowerCase().includes('pro'));
                    const pro = s.parts.filter(p => p.icon.toLowerCase().includes('pro'));

                    if (standard.length) standardHtml = `<div class="flex gap-1 justify-center text-slate-500">${standard.map(p => `<i data-lucide="${getInstrumentIcon(p.icon)}" class="w-4 h-4"></i>`).join('')}</div>`;
                    if (pro.length) proHtml = `<div class="flex gap-1 justify-center text-accent/80" title="Pro Instruments">${pro.map(p => `<i data-lucide="${getInstrumentIcon(p.icon)}" class="w-4 h-4 fill-current"></i>`).join('')}</div>`;
                }

                // Escape single/double quotes to avoid breaking onclick (passing index is safer)
                html += ` 
                    <tr class="hover:bg-slate-700/50 cursor-pointer transition-colors group border-l-4 border-transparent hover:border-accent" onclick="openModal(${i})"> 
                        <td class="p-4 ${columnState.name ? '' : 'col-hidden'}"> 
                            <div class="flex items-center gap-3">
                                <img src="${baseUrl}/album-art?song=${s.fullHash}" class="w-16 h-16 rounded bg-slate-800 object-cover shadow-sm" loading="lazy" onerror="this.style.display='none'">
                                <div>
                                    <div class="font-bold text-white group-hover:text-accent transition-colors text-base">${s.name || '-'}</div>
                                    <div class="text-slate-400 text-xs font-medium">${s.artist || '-'}</div>
                                </div>
                            </div>
                        </td> 
                        <td class="p-4 ${columnState.instruments ? '' : 'col-hidden'}">${standardHtml}</td> 
                        <td class="p-4 ${columnState.pro ? '' : 'col-hidden'}">${proHtml}</td> 
                        <td class="p-4 text-center ${columnState.isMaster ? '' : 'col-hidden'}"><input type="checkbox" disabled ${s.isMaster ? 'checked' : ''} class="accent-accent w-4 h-4 rounded border-slate-600 bg-slate-700"></td> 
                        <td class="p-4 text-slate-400 hidden md:table-cell truncate max-w-[150px] ${columnState.album ? '' : 'col-hidden'}" title="${s.album || ''}">${s.album || '-'}</td> 
                        <td class="p-4 hidden lg:table-cell ${columnState.genre ? '' : 'col-hidden'}">
                            <div class="text-slate-300 text-sm font-medium">${s.genre || '-'}</div>
                            <div class="text-slate-500 text-xs">${s.subgenre || ''}</div>
                        </td> 
                        <td class="p-4 text-slate-400 hidden xl:table-cell truncate max-w-[150px] ${columnState.charter ? '' : 'col-hidden'}" title="${s.charter || ''}">${s.charter || '-'}</td> 
                        <td class="p-4 text-slate-400 hidden 2xl:table-cell truncate max-w-[150px] ${columnState.playlist ? '' : 'col-hidden'}" title="${s.playlist || ''}">${s.playlist || '-'}</td> 
                        <td class="p-4 text-slate-400 hidden 2xl:table-cell truncate max-w-[150px] ${columnState.source ? '' : 'col-hidden'}" title="${s.source || ''}">${s.source || '-'}</td> 
                        <td class="p-4 text-slate-400 hidden sm:table-cell ${columnState.year ? '' : 'col-hidden'}">${s.year || '-'}</td> 
                        <td class="p-4 text-slate-400 text-right font-mono text-xs ${columnState.duration ? '' : 'col-hidden'}">${s.duration}</td> 
                    </tr> 
                `; 
            }
            
            // Using insertAdjacentHTML instead of appendChild in a loop for performance
            tbody.insertAdjacentHTML('beforeend', html);
            currentDisplayCount = end;
            lucide.createIcons();
        }

        // Modal Logic // Close by clicking outside
        const modal = document.getElementById('song-modal');
        const modalContent = document.getElementById('modal-content');

        function openModal(index) {
            const s = filteredSongs[index];
            if (!s) return;

            // Setup Image
            const img = document.getElementById('modal-img');
            const baseUrl = document.getElementById('api-url').value.trim();
            img.style.display = 'block';
            img.src = `${baseUrl}/album-art?song=${s.fullHash}&t=${Date.now()}`; // t param prevents caching issues if needed

            currentSongHash = s.fullHash;

            document.getElementById('modal-title').innerText = s.name || 'Unknown';
            document.getElementById('modal-artist').innerText = s.artist || 'Unknown';
            document.getElementById('modal-album').innerText = s.album || '-';
            document.getElementById('modal-year').innerText = s.year || '-';
            document.getElementById('modal-genre').innerText = s.genre || '-';
            document.getElementById('modal-duration').innerText = s.duration; 
            document.getElementById('modal-charter').innerText = s.charter || '-';
            
            let sourceStr = '-';
            if (s.source) {
                sourceStr = typeof s.source === 'string' ? s.source : (s.source.Original || JSON.stringify(s.source));
            }
            document.getElementById('modal-source').innerText = sourceStr;
            
            // Render Parts & Difficulties
            const partsContainer = document.getElementById('modal-parts-container');
            partsContainer.innerHTML = '';
            if (s.parts && Array.isArray(s.parts)) {
                s.parts.forEach(p => {
                    const icon = getInstrumentIcon(p.icon);
                    const diffsHtml = p.difficulties.map(d => `<span class="${getDifficultyColor(d)}">${d.substring(0,1)}</span>`).join(' ');
                    
                    const badge = document.createElement('div');
                    badge.className = 'bg-slate-700/50 border border-slate-600 rounded px-2 py-1 flex items-center gap-2 text-xs';
                    badge.innerHTML = `<i data-lucide="${icon}" class="w-3 h-3 text-slate-300"></i> <span class="font-mono font-bold tracking-widest">${diffsHtml}</span>`;
                    partsContainer.appendChild(badge);
                });
            }

            modal.classList.add('open');
            // Small delay for transition
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            document.getElementById('modal-img').src = ''; // Clear image
            setTimeout(() => {
                modal.classList.remove('open');
                currentSongHash = null;
            }, 200);
        }

        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        // Play Button Action
        document.getElementById('modal-play-btn').addEventListener('click', async () => {
            if (!currentSongHash) return;
            const btn = document.getElementById('modal-play-btn');
            const originalContent = btn.innerHTML;
            
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> SENDING...`;
            btn.disabled = true;
            lucide.createIcons();
            
            const baseUrl = document.getElementById('api-url').value.trim();
            try {
                const response = await fetch(`${baseUrl}/play?song=${currentSongHash}`, {
                    method: 'POST'
                });
                
                if (response.ok) { 
                    showToast("Song sent to play!");
                    closeModal(); 
                } else {
                    throw new Error(`Error ${response.status}`);
                }
            } catch (err) {
                console.error(err);
                alert(`Failed to play song: ${err.message}`);
            } finally {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                lucide.createIcons();
            }
        });

        // Toast Notification
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg; 
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Initial load and periodic ping
        document.addEventListener('DOMContentLoaded', () => {
            initColumnMenu();
            
            // Close column menu when clicking outside
            document.addEventListener('click', (e) => {
                const colMenu = document.getElementById('column-menu');
                const colBtn = document.querySelector('button[onclick="toggleColumnMenu()"]');
                if (colMenu && !colMenu.contains(e.target) && !colBtn.contains(e.target)) {
                    colMenu.classList.add('hidden');
                    colMenu.classList.remove('flex');
                }
                
                const advMenu = document.getElementById('advanced-filters');
                const advBtn = document.querySelector('button[onclick="toggleAdvancedFilters()"]');
                if (advMenu && !advMenu.contains(e.target) && !advBtn.contains(e.target) && !document.getElementById('search-global').contains(e.target)) {
                    advMenu.classList.add('hidden');
                }
            });

            pingServer(); // Check immediately
            pingInterval = setInterval(pingServer, 2000); // Check every 2 seconds
            
            // Infinite Scroll
            const sentinel = document.getElementById('scroll-sentinel');
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) {
                    loadMore();
                }
            }, { rootMargin: '200px' });
            if (sentinel) observer.observe(sentinel);
        });
    </script>
</body>
</html>
